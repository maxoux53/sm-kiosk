services:
  db:
    container_name: sm_kiosk_db_container
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/scripts:/docker-entrypoint-initdb.d
    networks:
      - sm-kiosk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: sm_kiosk_api_container
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: ${PORT:-3001}
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DB}
      JWT_SECRET: ${JWT_SECRET}
      PEPPER: ${PEPPER}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID}
      CF_API_TOKEN: ${CF_API_TOKEN}
      CF_ACCOUNT_HASH: ${CF_ACCOUNT_HASH}
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sm-kiosk-network
    restart: unless-stopped

  # ---- Front Web (à venir) ----
  # front:
  #   container_name: sm_kiosk_front_container
  #   build:
  #     context: ./front
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - api
  #   networks:
  #     - sm-kiosk-network
  #   restart: unless-stopped

networks:
  sm-kiosk-network:
    driver: bridge

volumes:
  pgdata: